name: Build Nova Mod Menu

on:
  push:
    branches: [ "nova-mod-menu-prototype" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build and test
        run: gradle clean test build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-mod-menu-prototype
          path: |
            build/libs/nova-mod-menu-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish JAR release asset
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nova-prototype-${{ github.run_number }}
          name: Nova Mod Menu Prototype ${{ github.run_number }}
          files: build/libs/nova-mod-menu-*.jar
          generate_release_notes: true
