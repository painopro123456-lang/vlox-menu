screen = EFFECTS
screen.EFFECTS = SHARPEN TONEMAP_STRENGTH BLOOM BLOOM_STRENGTH VIBRANCE VIGNETTE

sliders = SHARPEN TONEMAP_STRENGTH BLOOM_STRENGTH VIBRANCE VIGNETTE
slider.SHARPEN = 0.0 1.5
slider.TONEMAP_STRENGTH = 0.0 1.0
slider.BLOOM_STRENGTH = 0.0 1.0
slider.VIBRANCE = 0.0 1.0
